site_name: Dharma
site_url: https://acorn23.github.io/dharma/

nav:
  - Home: index.md

  - Philosophy:
      - Introduction: introduction.md
      - Understanding Reality: reality.md
      - Morality and Death: death.md
      - Superstition and Belief Systems: superstition.md
      - Postmodernism: postmodernism.md
      - Beauty: beauty.md

  - Surveillance:
      - You are a Commodity: panopticon.md
      - AI Enabled Mass Surveillance: ai.md

  - Geopolitics:
      - Ukraine War: ukraine.md
      - Gaza Genocide: gaza.md
      - India:
          - Withering Democracy: autocracy.md
          - Financial System: finance.md

  - Truth:
      - "In [Redacted] We Trust": devil.md
      - Civilization Is A Scam: civilization.md
      - Justice Is the Will of the Stronger: justice.md

  - Archive:
      - The Sacrificial Machine—How Private Finance Turned War into Permanent Profit: war.md

  - Resources: resources.md
  - Guestbook: comments.md
  - About: about.md

theme:
  name: material
  custom_dir: overrides

  palette:
    scheme: slate
    primary: teal
    accent: teal

  logo: img/atom.png
  favicon: img/atom.png

  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - header.autohide
    - navigation.footer
    - search.suggest

plugins:
  - blog
  - tags
  - search

markdown_extensions:
  - attr_list
  - md_in_html
  - pymdownx.tilde

extra_css:
  - stylesheets/extra.css

extra:
  generator: false

extra_javascript:
  - javascripts/homepage.js
